name: Build Windows installer

# Builds the online-bootstrap installer and attaches it to the release that
# triggered the run. Also runnable manually against an existing tag.
#
# The tag is resolved before checkout and used as the checkout ref, so the
# installer is always built from the exact tree it gets attached to — a manual
# run cannot ship a build of some other branch under a release's name.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installer to (e.g. v0.3.0)
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # upload the installer as a release asset
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out clapsync at the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Must satisfy requires-python in pyproject.toml — pip wheel runs
          # against this interpreter.
          python-version: '3.13'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: python installer/build.py

      - name: Attach installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            outputs/clapsync-setup-*.exe \
            --clobber --repo "${{ github.repository }}"
