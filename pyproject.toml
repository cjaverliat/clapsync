[project]
name = "clapsync"
version = "0.2.0"
description = "Multi-camera audio-based synchronization and trimming tool"
requires-python = ">=3.10,<3.13"
# Abstract runtime deps for consumers. Media I/O is framepipe (video decode)
# plus PyAV (audio, muxing); both bind the ffmpeg shared libraries. No CUDA
# index is pinned here on purpose — the consuming project installs torch from
# the appropriate CUDA wheel index. This workspace's own cu130 pins live in
# [tool.pixi.pypi-dependencies] for dev.
dependencies = [
    "numpy",
    "torch>=2.11",
    "torchaudio>=2.11",
]

[project.optional-dependencies]
app = ["av>=18", "framepipe @ git+https://github.com/cjaverliat/framepipe"]
gui = ["clapsync[app]", "PySide6>=6.7,<6.8"]
triton = [
    "triton; sys_platform == 'linux'",
    "triton-windows; sys_platform == 'win32'",
]

[project.scripts]
clapsync = "clapsync.gui.app:main"
clapsync-cli = "clapsync.cli:main"

[project.gui-scripts]
clapsync-gui = "clapsync.gui.app:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

# Torch/PySide6 pins here (and the triton pin in
# [tool.pixi.target.win-64.pypi-dependencies]) are duplicated in
# installer/pixi.toml (shipped Windows env) — keep them in sync when
# bumping.
[tool.pixi.pypi-dependencies]
clapsync = { path = ".", editable = true }
framepipe = { path = "../framepipe", editable = true }
torch = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu130" }
numpy = "*"
av = "*"
PySide6 = ">=6.7.0,<6.8"
pytest = "*"

# Triton distribution is per-platform: upstream on Linux, the woct0rdho fork on
# Windows. Both expose "import triton". framepipe uses it for the fused NV12->RGB
# decode kernel; without it the slower torch fallback runs. Version MUST track
# the torch pin above: torch 2.11 -> upstream triton 3.5.0 (newer minors ->
# alloca LNK2019 on Windows).
[tool.pixi.target.linux-64.pypi-dependencies]
triton = "*"  # torch pins this transitively on Linux

[tool.pixi.target.win-64.pypi-dependencies]
triton-windows = "==3.5.0.post21"

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
pip = "*"
setuptools = "<82"  # torch 2.11 requires setuptools<82; conda pins 82 via pip
pixi-pycharm = ">=0.0.11,<0.0.12"
ffmpeg = "*"
nuitka = ">=4.0.8,<5"
libpython-static = ">=3.10.20,<4"

[tool.pixi.feature.cuda130.system-requirements]
cuda = "13.0"

[tool.pixi.feature.cuda130.dependencies]
cuda-version = "13.0.*"
cudnn = "*"

[tool.pixi.feature.dev.dependencies]
pandoc = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pypandoc = "*"
weasyprint = "*"

[tool.pixi.environments]
default = { features = ["cuda130"], solve-group = "default" }
dev     = { features = ["cuda130", "dev"], solve-group = "default" }

[tool.pytest.ini_options]
markers = ["slow: requires framepipe/PyAV decode/encode with real codecs"]
testpaths = ["tests"]

[tool.pixi.tasks]
clapsync = "clapsync"

[tool.pixi.tasks.build-clapsync]
cmd = """
nuitka \
  --output-dir=outputs \
  --output-filename=clapsync \
  --include-package=clapsync \
  --show-progress \
  src/clapsync/gui/app.py
"""
description = "Build standalone clapsync binary"

[tool.pixi.tasks.build-installer]
cmd = "python installer/build.py"
description = "Build the Windows online-bootstrap installer"
