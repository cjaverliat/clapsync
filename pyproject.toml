[project]
name = "clapsync"
version = "0.1.0"
description = "Multi-camera audio-based synchronization and trimming tool"
requires-python = ">=3.10,<3.13"
dependencies = []

[project.scripts]
clapsync = "clapsync.app:main"
clapsync-cli = "clapsync.cli:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
clapsync = { path = ".", editable = true }
framepipe = { git = "https://github.com/cjaverliat/framepipe.git" }
torch = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu128" }
torchcodec = { version = ">=0.13.0,<0.14.0", index = "https://download.pytorch.org/whl/cu128" }
numpy = "*"
av = "*"
PySide6 = ">=6.7.0,<6.8"

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
pip = "*"
pixi-pycharm = ">=0.0.11,<0.0.12"
ffmpeg = "*"
nuitka = ">=4.0.8,<5"
libpython-static = ">=3.10.20,<4"

[tool.pixi.feature.cuda128.system-requirements]
cuda = "12.8"

[tool.pixi.feature.cuda128.dependencies]
cuda-version = "12.8.*"
cudnn = "*"

[tool.pixi.feature.dev.dependencies]
pandoc = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pypandoc = "*"
weasyprint = "*"
pytest = "*"

[tool.pixi.environments]
default = { features = ["cuda128"], solve-group = "default" }
dev     = { features = ["cuda128", "dev"], solve-group = "default" }

[tool.pytest.ini_options]
markers = ["slow: requires torchcodec decode/encode with real codecs"]
testpaths = ["tests"]

[tool.pixi.tasks]
clapsync = "clapsync"

[tool.pixi.tasks.build-clapsync]
cmd = """
nuitka \
  --output-dir=outputs \
  --output-filename=clapsync \
  --include-package=clapsync \
  --show-progress \
  src/clapsync/app.py
"""
description = "Build standalone clapsync binary"
