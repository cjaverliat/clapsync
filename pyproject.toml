[project]
name = "clapsync"
version = "0.1.0"
description = "Multi-camera audio-based synchronization and trimming tool"
requires-python = ">=3.10,<3.13"
# Abstract runtime deps for consumers. torchcodec >=0.13 provides the
# multi-stream Encoder (muxed A/V); it requires torch 2.11. No CUDA/index is
# pinned here on purpose — the consuming project installs torch + torchcodec
# from the appropriate CUDA wheel index (they must share a CUDA build). This
# workspace's own cu130 pins live in [tool.pixi.pypi-dependencies] for dev.
dependencies = [
    "numpy",
    "torch>=2.11",
    "torchaudio>=2.11",
    "torchcodec>=0.13",
]

[project.scripts]
clapsync = "clapsync.gui.app:main"
clapsync-cli = "clapsync.cli:main"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
clapsync = { path = ".", editable = true }
framepipe = { git = "https://github.com/cjaverliat/framepipe.git" }
torch = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu130" }
torchaudio = { version = ">=2.11.0,<2.12.0", index = "https://download.pytorch.org/whl/cu130" }
torchcodec = { version = ">=0.13.0,<0.15.0", index = "https://download.pytorch.org/whl/cu130" }
numpy = "*"
av = "*"
PySide6 = ">=6.7.0,<6.8"
pytest = "*"

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
pip = "*"
setuptools = "<82"  # torch 2.11 requires setuptools<82; conda pins 82 via pip
pixi-pycharm = ">=0.0.11,<0.0.12"
ffmpeg = "*"
nuitka = ">=4.0.8,<5"
libpython-static = ">=3.10.20,<4"

[tool.pixi.feature.cuda130.system-requirements]
cuda = "13.0"

[tool.pixi.feature.cuda130.dependencies]
cuda-version = "13.0.*"
cudnn = "*"

[tool.pixi.feature.dev.dependencies]
pandoc = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pypandoc = "*"
weasyprint = "*"

[tool.pixi.environments]
default = { features = ["cuda130"], solve-group = "default" }
dev     = { features = ["cuda130", "dev"], solve-group = "default" }

[tool.pytest.ini_options]
markers = ["slow: requires torchcodec decode/encode with real codecs"]
testpaths = ["tests"]

[tool.pixi.tasks]
clapsync = "clapsync"

[tool.pixi.tasks.build-clapsync]
cmd = """
nuitka \
  --output-dir=outputs \
  --output-filename=clapsync \
  --include-package=clapsync \
  --show-progress \
  src/clapsync/app.py
"""
description = "Build standalone clapsync binary"
